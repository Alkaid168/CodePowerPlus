<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>码力加加</title><style>body{font-family:system-ui;max-width:900px;margin:40px auto;padding:0 20px}textarea{width:100%;height:180px}button{padding:10px 18px;margin-top:12px}pre{background:#f4f4f4;padding:16px;white-space:pre-wrap}</style></head><body><h1>码力加加</h1><p>程序设计智能辅导系统</p><textarea id="d" placeholder="粘贴题目描述"></textarea><br><button onclick="analyze()">分析题目</button><pre id="o"></pre><script>async function analyze(){const d=document.getElementById('d').value;const r=await fetch('/api/problems/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({description:d})});document.getElementById('o').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
